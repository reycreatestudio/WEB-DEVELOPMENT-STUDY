          <style>
            /* The outer container controls the maximum width and centers the map */
            .mapouter {
              position: relative;
              display: flex;
              flex-direction: column;
              width: 100%;
              /* Spans full width of its parent element */
              max-width: 800px;
              /* Optional: stops the map from getting too wide on desktop screens */
              margin: 0 auto;
              /* Centers the map container on the page */
            }

            /* The canvas enforces a responsive aspect ratio */
            .gmap_canvas {
              width: 100%;
              aspect-ratio: 16 / 9;
              /* Modern landscape layout for desktop/tablets */
              overflow: hidden;
              background: none !important;
              border-radius: 8px;
              /* Optional: gives the map clean, rounded corners */
              box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
              /* Optional: adds a subtle modern shadow */
            }

            /* The iframe fills 100% of the canvas dynamic sizing */
            .gmap_canvas iframe {
              width: 100%;
              height: 100%;
            }

            .mapouter a {
              display: block;
              font-size: 0.85em;
              text-align: center;
              padding: 5px 0;
              color: #6c757d;
              text-decoration: none;
            }

            .gme-generated-link {
              display: none !important;
            }

            /* Mobile optimization */
            @media (max-width: 480px) {
              .gmap_canvas {
                aspect-ratio: 4 / 3;
                /* Shifts to a squarer box so it's taller and easier to navigate on phones */
              }
            }
