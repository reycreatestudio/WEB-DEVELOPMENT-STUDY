<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello!</title>
  <style>
    #grid {
      background-color: gray;
      display: grid;
      padding: 20px;
      grid-column-gap: 20px;
      grid-row-gap: 10px;
      grid-template-columns: 200px 200px auto;
      
      
    }

    .grid {
      background-color: lightgray;
      font-size: 20px;
      padding: 20px;
      color: white;
    }
  </style>
</head>

<body>
  <div id="grid">
    <div id="grid-item">1</div>
    <div id="grid-item">2</div>
    <div id="grid-item">3</div>
    <div id="grid-item">4</div>
    <div id="grid-item">5</div>
    <div id="grid-item">6</div>
    <div id="grid-item">7</div>
    <div id="grid-item">8</div>
  </div>
</body>

</html>
